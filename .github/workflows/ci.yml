name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        # ─────────────────────────────────────────────────────────────
        # PLACEHOLDER — add GEMINI_API_KEY to your GitHub repo secrets
        # to enable the live LLM path in CI.
        #
        # Steps:
        #   GitHub repo → Settings → Secrets → Actions → New secret
        #   Name:  GEMINI_API_KEY
        #   Value: your Gemini API key from https://aistudio.google.com/apikey
        #
        # Without it, the advisor gracefully falls back to the default
        # pass order and all tests still pass.
        # ─────────────────────────────────────────────────────────────
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pytest tests/ -v
