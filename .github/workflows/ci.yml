name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The two ends of the supported range.  The llvmlite wheel bundles LLVM,
    # so no system LLVM is installed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            llvmlite: "llvmlite==0.40.0"   # oldest supported
          - python-version: "3.12"
            llvmlite: "llvmlite"           # current release

    name: Python ${{ matrix.python-version }} / ${{ matrix.llvmlite }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt "${{ matrix.llvmlite }}"
        python -c "import llvmlite; print('llvmlite', llvmlite.__version__)"

    - name: Run tests
      env:
        # ─────────────────────────────────────────────────────────────
        # Add GEMINI_API_KEY to GitHub repo secrets to enable the live
        # LLM path in CI.
        #   Settings → Secrets → Actions → New secret
        #   Name:  GEMINI_API_KEY
        #   Value: your key from https://aistudio.google.com/apikey
        #
        # Without it the advisor falls back to default passes and all
        # tests still pass.
        # ─────────────────────────────────────────────────────────────
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pytest tests/ -v --tb=short
