name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install LLVM 14 (for llvmlite backend)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y llvm-14 llvm-14-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        # ─────────────────────────────────────────────────────────────
        # Add GEMINI_API_KEY to GitHub repo secrets to enable the live
        # LLM path in CI.
        #   Settings → Secrets → Actions → New secret
        #   Name:  GEMINI_API_KEY
        #   Value: your key from https://aistudio.google.com/apikey
        #
        # Without it the advisor falls back to default passes and all
        # tests still pass.
        # ─────────────────────────────────────────────────────────────
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pytest tests/ -v --tb=short
